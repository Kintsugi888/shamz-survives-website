name: Rename website file to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move uploaded file to index.html
        run: |
          ls -lh
          test -f shamz-survives-website.html
          mv shamz-survives-website.html index.html
          ls -lh index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Rename website file to index.html"
          git push
